name: CI — Tests unitaires & Build Docker

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

defaults:
  run:
    working-directory: docker-gradio-amc

jobs:
  # -----------------------------------------------------------
  # Lint — vérification syntaxe
  # -----------------------------------------------------------
  lint:
    name: Lint (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérification syntaxe
        run: |
          python -m py_compile app.py
          python -m py_compile amc_database.py
          python -m py_compile amc_project.py
          python -m py_compile amc_wrapper.py
          python -m py_compile standard_mode.py

  # -----------------------------------------------------------
  # Tests unitaires (3 versions Python)
  # -----------------------------------------------------------
  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            docker-gradio-amc/requirements.txt
            docker-gradio-amc/requirements-test.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Lancer les tests
        run: |
          pytest tests/ -v --tb=short -m "not slow" \
            --junitxml=report.xml \
            --cov=. --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload rapport JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report-py${{ matrix.python-version }}
          path: docker-gradio-amc/report.xml

      - name: Upload couverture
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: docker-gradio-amc/coverage.xml

  # -----------------------------------------------------------
  # Build Docker (uniquement sur master)
  # -----------------------------------------------------------
  build-docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: docker-gradio-amc
          push: false
          tags: gradio-amc:${{ github.sha }},gradio-amc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
