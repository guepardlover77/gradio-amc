stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/

# -----------------------------------------------------------
# Stage 1 : Lint — vérification syntaxe et imports
# -----------------------------------------------------------

lint:syntax:
  stage: lint
  image: python:3.11-slim
  script:
    - python -m py_compile app.py
    - python -m py_compile amc_database.py
    - python -m py_compile amc_project.py
    - python -m py_compile amc_wrapper.py
  rules:
    - changes:
        - "*.py"
        - "tests/**/*.py"

# -----------------------------------------------------------
# Stage 2 : Tests unitaires et intégration
# -----------------------------------------------------------

test:unit:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt -r requirements-test.txt
  script:
    - pytest tests/ -v --tb=short --junitxml=report.xml --cov=. --cov-report=term --cov-report=html:htmlcov
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - htmlcov/
    expire_in: 7 days
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  rules:
    - changes:
        - "*.py"
        - "tests/**/*.py"
        - "requirements*.txt"

test:python310:
  stage: test
  image: python:3.10-slim
  before_script:
    - pip install -r requirements.txt -r requirements-test.txt
  script:
    - pytest tests/ -v --tb=short
  rules:
    - changes:
        - "*.py"
        - "tests/**/*.py"

test:python312:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -r requirements.txt -r requirements-test.txt
  script:
    - pytest tests/ -v --tb=short
  rules:
    - changes:
        - "*.py"
        - "tests/**/*.py"

# -----------------------------------------------------------
# Stage 3 : Build Docker
# -----------------------------------------------------------

build:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE:latest .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:docker:push:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
